name: CI/CD — Development

on:
  push:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Job 1: Build & Push to GHCR ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image (dev)
    runs-on: ubuntu-latest
    environment: development
    permissions:
      packages: write
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 2: Deploy to Dev Server ─────────────────────────────────────────────
  deploy:
    name: Deploy to Dev Server
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Copy compose file to dev server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deployments/development/docker-compose.yml"
          target: "mljdl-landing"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            mkdir -p ~/mljdl-landing/deployments/development
            cd ~/mljdl-landing/deployments/development

            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

            # ── Write .env fresh on every deploy (never committed to repo) ──────
            {
              echo "IMAGE_TAG=dev-$SHORT_SHA"
              echo "GITHUB_REPOSITORY=${{ github.repository }}"
              echo ""
              echo "# Future application env placeholders:"
              echo "# VITE_API_URL=https://api.example.com"
            } > .env
            chmod 600 .env

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── Pull latest image and restart ────────────────────────────────────
            docker compose pull
            docker compose up -d --remove-orphans --force-recreate

            docker image prune -f
            docker compose ps
            echo "✅ Dev deployment complete: ghcr.io/${{ github.repository }}:dev-$SHORT_SHA"
