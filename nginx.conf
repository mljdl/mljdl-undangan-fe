server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 https://mljdl.com;
    }

    location = /rizki-nadia {
        return 301 /rizki-nadia/;
    }

    location /rizki-nadia/ {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|map|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        return 302 https://mljdl.com;
    }
}