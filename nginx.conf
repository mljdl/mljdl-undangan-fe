server {
    listen 80;
    server_name by.mljdl.com;

    root /usr/share/nginx/html;
    index index.html;

    # Root domain: by.mljdl.com → mljdl.com
    location = / {
        return 301 https://mljdl.com;
    }

    # Normalisasi tanpa trailing slash
    location = /rizki-nadia {
        return 301 /rizki-nadia/;
    }

    # Project path valid
    location /rizki-nadia/ {
        try_files $uri $uri/ /rizki-nadia/index.html;
    }

    # Static assets
    location ~* ^/rizki-nadia/.+\.(?:css|js|mjs|map|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Semua path salah
    location / {
        return 302 https://mljdl.com;
        # atau kalau mau lebih tegas:
        # return 404;
    }
}