server {
    listen 80;
    server_name _;

    location = / {
        return 302 https://mljdl.com;
    }

    location = /rizki-nadia {
        return 301 /rizki-nadia/;
    }

    location ^~ /rizki-nadia/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location / {
        return 302 https://mljdl.com;
    }
}